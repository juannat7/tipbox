[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tipbox"
version = "0.0.1"
description = "Collection of box models for tipping point analysis"
authors = [
    {name = "Juan Nathaniel", email = "jn2808@columbia.edu"},
]
dependencies = [
    "jax",
    "jaxlib",
    "numpy",
    "matplotlib",
]

requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
docs = ["sphinx>=7,<9"]

[tool.setuptools.packages.find]
include = ["tipbox*"]

[project.urls]
Homepage = "https://github.com/juannat7/tipbox"
Issues = "https://github.com/juannat7/tipbox/issues"
